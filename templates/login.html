{% extends "base.html" %}
{% block title %}Login — SI Surat Tugas{% endblock %}
{% block content %}
<div class="login-wrap">
  <div class="login-card">
    <h1>SI Surat Tugas Ambulance</h1>
    <div class="rs">RSUD Cut Nyak Dhien Meulaboh · Pemerintah Kabupaten Aceh Barat</div>
    <form method="post">
      <div class="field"><label>Username</label><input name="username" required autofocus></div>
      <div class="field"><label>Password</label><input name="password" type="password" required></div>
      <button class="btn-primary" style="width:100%">Masuk</button>
    </form>
    <div class="hint" style="margin-top:14px;text-align:center">Akun awal — Admin: <b>admin / admin123</b> · Koordinator: <b>koordinator / koord123</b></div>
  </div>
</div>
{% endblock %}
